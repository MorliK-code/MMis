services:
  searxng:
    image: searxng/searxng:latest
    container_name: mmis-searxng
    ports:
      - "${SEARXNG_HOST_PORT:-8080}:${SEARXNG_CONTAINER_PORT:-8080}"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_CONTAINER_PORT=${SEARXNG_CONTAINER_PORT:-8080}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; p=os.getenv('SEARXNG_CONTAINER_PORT','8080'); urllib.request.urlopen(f'http://127.0.0.1:{p}/search?q=ping&format=json', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
